name: Hosting

# Runs the conformance corpus (src/Hosting/fixtures) on every host: .NET CLI from source and from
# precompiled bytecode, browsers (headless Chromium, Firefox and WebKit) and Java (worker, CoreCLR and
# NativeAOT in process). Each runner checks its results against fixtures/known-failures/<host>.json and
# fails on a new, changed or fixed failure. The per-host counts go to the job summary, and so does the
# browser first-load budget (src/Hosting/browser/budget.json), which fails the job when exceeded.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Installs the .NET SDK and runtime, Java, Maven, Node and CMake pinned in
      # mise.toml, and puts them on PATH (with DOTNET_ROOT and JAVA_HOME) for
      # the steps below.
      - name: Setup tools from mise.toml
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # A mise release older than seven days.
          version: 2026.10.11

      - name: Build host CLI
        run: dotnet build -c Release src/Hosting/MoonSharp.Hosting.Cli

      - name: Validate fixture scripts
        run: dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll validate src/Hosting/fixtures/scripts/*.lua

      - name: Fixtures on .NET
        run: |
          set -o pipefail
          dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll test src/Hosting/fixtures | tee fixtures.log
          grep '^dotnet: ' fixtures.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Fixtures on .NET, invariant globalization
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll test src/Hosting/fixtures

      # A culture with a decimal comma; known-failures/dotnet-tr-TR.json lists what still depends on it.
      - name: Fixtures on .NET, Turkish culture
        env:
          LANG: tr_TR.UTF-8
        run: |
          set -o pipefail
          dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll test --host dotnet-tr-TR src/Hosting/fixtures | tee fixtures.log
          grep '^dotnet-tr-TR: ' fixtures.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      # Every chunk compiled as `moonsharp-host compile` does at publish time, then loaded as bytecode.
      - name: Fixtures on .NET from precompiled bytecode
        run: |
          set -o pipefail
          dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll test --bytecode src/Hosting/fixtures | tee fixtures.log
          grep '^dotnet-bytecode: ' fixtures.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      # The browser package relinks dotnet.native.wasm (WasmBuildNative), which needs Emscripten from
      # the wasm-tools workload. 10.0.402 is the workload set of the SDK pinned in mise.toml; change
      # both together.
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools --version 10.0.402

      - name: Build browser package
        working-directory: src/Hosting/browser
        run: |
          npm ci
          npx tsc -p tsconfig.json
          dotnet publish -c Release

      # The browser builds pinned by the Playwright version in package-lock.json.
      - name: Fixtures in headless Chromium, Firefox and WebKit
        working-directory: src/Hosting/browser
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium firefox webkit
          node test/smoke.mjs bin/Release/net10.0/publish/wwwroot ../fixtures chromium firefox webkit | tee fixtures.log
          grep '^browser-' fixtures.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Build the in-process variants (CoreCLR component, NativeAOT library, JNI shim)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang zlib1g-dev
          dotnet build -c Release src/Hosting/MoonSharp.Hosting.Native
          dotnet publish -c Release -r linux-x64 -p:NativeAot=true src/Hosting/MoonSharp.Hosting.Native
          cmake -S src/Hosting/native -B src/Hosting/native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/Hosting/native/build

      - name: Fixtures on Java (worker, in-process CoreCLR and NativeAOT, Spring Boot sample)
        working-directory: src/Hosting/java
        run: |
          set -o pipefail
          mvn -B test -Dmoonsharp.inprocess.required=true | tee fixtures.log
          grep -E '^java-(worker|coreclr|nativeaot): ' fixtures.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      # Last, so that a budget overrun does not hide the Java results. Writes its table to the job summary.
      - name: Browser first-load budget
        working-directory: src/Hosting/browser
        run: node test/budget.mjs bin/Release/net10.0/publish/wwwroot ../fixtures
