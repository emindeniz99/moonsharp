name: Hosting

# Runs the shared fixtures on every host: .NET CLI, browser (headless Chromium) and Java.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build host CLI
        run: dotnet build -c Release src/Hosting/MoonSharp.Hosting.Cli

      - name: Validate fixture scripts
        run: dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll validate src/Hosting/fixtures/scripts/*.lua

      - name: Fixtures on .NET
        run: dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll test src/Hosting/fixtures/logic.suite.json

      - name: Fixtures on .NET, invariant globalization
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: dotnet src/Hosting/MoonSharp.Hosting.Cli/bin/Release/net8.0/moonsharp-host.dll test src/Hosting/fixtures/logic.suite.json

      - name: Build browser package
        working-directory: src/Hosting/browser
        run: |
          npm ci
          npx tsc -p tsconfig.json
          dotnet publish -c Release

      - name: Fixtures in headless Chromium
        working-directory: src/Hosting/browser
        run: |
          npx playwright install --with-deps chromium
          node test/smoke.mjs bin/Release/net10.0/publish/wwwroot ../fixtures

      - name: Fixtures on Java (worker client and Spring Boot sample)
        working-directory: src/Hosting/java
        run: mvn -B test
