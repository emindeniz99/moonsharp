name: LuaCATS

# Checks the LuaCATS generator (src/Tools/MoonSharp.LuaCats): the committed
# definitions of the sample host are up to date, and the pinned
# lua-language-server accepts them and the sample scripts.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  luacats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The .NET SDK and runtime pinned in mise.toml.
      - name: Setup tools from mise.toml
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # A mise release older than seven days.
          version: 2026.10.11

      - name: Build the generator, its CLI and its tests
        run: |
          dotnet build -c Release src/Tools/MoonSharp.LuaCats.Cli
          dotnet build -c Release src/Tools/MoonSharp.LuaCats.Tests

      - name: Committed sample definitions are up to date (CLI --check)
        run: >
          dotnet src/Tools/MoonSharp.LuaCats.Cli/bin/Release/net8.0/moonsharp-luacats.dll
          src/Tools/MoonSharp.LuaCats.Tests/bin/Release/net8.0/MoonSharp.LuaCats.Tests.dll
          Sample.SampleApi.CreateScript src/Tools/MoonSharp.LuaCats.Tests/expected --check

      # tools/luals/install.sh downloads the pinned release and checks its SHA-256.
      - name: Generator tests with lua-language-server
        run: |
          luals="$(tools/luals/install.sh "$RUNNER_TEMP/luals")"
          dotnet src/Tools/MoonSharp.LuaCats.Tests/bin/Release/net8.0/MoonSharp.LuaCats.Tests.dll src/Tools/MoonSharp.LuaCats.Tests/expected --luals "$luals"
